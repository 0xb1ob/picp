name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs once: typecheck plus the checks that do not depend on the test run.
  checks:
    name: typecheck + checks
    # GitHub-hosted ubuntu-latest, except while this repository is private:
    # then the operator's ephemeral self-hosted runner keeps gating PRs. A
    # public repository never selects the privileged self-hosted runner.
    # See docs/development.md "CI".
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","nomad"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration ledger check reads the pinned baseline commit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci-as-user.sh npm ci

      # The retired external tracker stays out of every tracked file and file name,
      # outside the exact lines scripts/retired-integration-allowlist.json freezes.
      - name: Retired integration guard
        run: bash scripts/ci-as-user.sh npm run check:retired-integration

      - name: Migration ledger check
        run: bash scripts/ci-as-user.sh node scripts/test-migration-check.ts
        timeout-minutes: 5

      - name: Shard assignment covers every test file once
        run: bash scripts/ci-as-user.sh npm run check:shards

      - name: Typecheck
        run: bash scripts/ci-as-user.sh npm run typecheck

      # Offline contract eval: fails when evals/results/contract.json is stale.
      # Never set CP_EVAL_LIVE here; --live is not passed.
      - name: Eval contract check
        run: bash scripts/ci-as-user.sh npm run eval:check
        timeout-minutes: 5

  test-shard:
    name: test-shard (${{ matrix.shard }})
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","nomad"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci-as-user.sh npm ci

      # The m2/m3/pipeline lease suites need a real treehouse on PATH and
      # self-skip without it; tests/ci-host-tools.test.ts fails the run if it
      # is missing. Prepending ~/.local/bin makes the upstream install script
      # pick that directory (no sudo). install-tools.ts no-ops when the image
      # already has one copy. The version is pinned in src/tool-manifest.ts.
      - name: Install treehouse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Root and sudo-capable runners install under the unprivileged user's home (scripts/ci-as-user.sh).
          if [ "$(id -u)" = 0 ] || sudo -n true 2>/dev/null; then bin=/home/cpci/.local/bin; else bin="$HOME/.local/bin"; fi
          bash scripts/ci-as-user.sh mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          # install-tools downloads a pinned release asset directly, authenticated by the
          # job token (no anonymous API call; #428). Up to 3 tries, 30s then 60s apart.
          for attempt in 1 2 3; do
            PATH="$bin:$PATH" bash scripts/ci-as-user.sh node scripts/install-tools.ts treehouse && break
            [ "$attempt" = 3 ] && exit 1
            echo "treehouse install attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          PATH="$bin:$PATH" bash scripts/ci-as-user.sh treehouse --version

      # Diagnostic for the hosted-runner "operation was canceled" runs: memory, top RSS and per-uid process
      # counts every 20 s, printed by the always() step below; job output only, nothing committed.
      - name: Start resource sampler
        run: |
          nohup bash -c 'while :; do
            echo "=== $(date -u +%H:%M:%S) load $(cut -d" " -f1-4 /proc/loadavg)"
            free -m
            ps -eo pid,ppid,uid,rss,etime,args --sort=-rss | head -n 11 | cut -c1-200
            echo "processes per uid:"; ps -eo uid= | sort -n | uniq -c
            df -h / /tmp | tail -n +2
            bash scripts/ci-rss-watchdog.sh "$RUNNER_TEMP/rss-handled" || true
            sleep 20
          done' > "$RUNNER_TEMP/sampler.log" 2>&1 &

      - name: Run suite shard ${{ matrix.shard }}/4 (scripts/test-timings.json)
        run: |
          # Live sampler lines in this step's log too: a cancelled job skipped the tail step below.
          tail -n 0 -F "$RUNNER_TEMP/sampler.log" & tailer=$!
          trap 'kill "$tailer"' EXIT
          # Node does not create --report-directory; make it as cpci so the suite can write there.
          bash scripts/ci-as-user.sh mkdir -p /tmp/cp-node-reports
          bash scripts/ci-as-user.sh sh -c 'echo "suite runs as uid $(id -u) ($(id -un))"; exec npm run test:shard' || rc=$?
          for f in /tmp/cp-node-reports/*.json; do
            [ -e "$f" ] && { node -e 'const r=require(process.argv[1]);console.log(r.header?.event, r.javascriptStack?.message);console.log((r.javascriptStack?.stack||[]).slice(0,40).join("\n"))' "$f" || true; }
          done
          exit ${rc:-0}
        env:
          CP_TEST_SHARD: ${{ matrix.shard }}
          # Never set CP_LIVE_TESTS here: the live suites hit real models,
          # cost money and need credentials. They self-skip without it.
          CP_LIVE_TESTS: ""
          # 16 GB public runner; 3 concurrent files x 4 GB fits; Node's default on 16 GB is ~4 GB
          # scripts/ci-as-user.sh carries it to the cpci suite through its 0600 env file.
          NODE_OPTIONS: --max-old-space-size=4096 --report-on-fatalerror --report-on-signal --report-signal=SIGUSR2 --report-directory=/tmp/cp-node-reports
          # Whole-suite cgroup backstop (3 files x 4 GB heap fit); scripts/ci-rss-watchdog.sh kills one process at 3 GB.
          CP_SUITE_MEMORY_MAX: 13G

      - name: Resource sampler tail and kernel OOM lines
        if: always() || cancelled()
        run: |
          tail -n 400 "$RUNNER_TEMP/sampler.log" || echo "no sampler log"
          sudo -n dmesg 2>/dev/null | grep -iE 'oom|killed process' || echo "no OOM lines in dmesg (or dmesg unreadable)"


  # The one required check: fails unless typecheck and every shard succeeded.
  test:
    name: test
    needs: [checks, test-shard]
    if: always()
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","nomad"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every shard and the checks
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled|skipped'; then exit 1; fi

  # Real installs in a disposable Docker sandbox (#375; tests/e2e/README.md "Installer sandbox"): npm test
  # skips tests/e2e/installer.test.ts; this job opts in and fails when Docker is missing.
  install-sandbox:
    name: install sandbox
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","nomad"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: bash scripts/ci-as-user.sh npm ci

      - name: Installer sandbox (Docker)
        run: bash scripts/ci-as-user.sh npm run test:one -- tests/e2e/installer.test.ts
        env:
          CP_INSTALL_E2E: "1"
