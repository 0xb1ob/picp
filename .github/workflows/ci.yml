name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    # GitHub-hosted ubuntu-latest, except while this repository is private:
    # then the operator's ephemeral self-hosted runner keeps gating PRs. A
    # public repository never selects the privileged self-hosted runner.
    # See docs/development.md "CI".
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","nomad"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The m2/m3/pipeline lease suites need a real treehouse on PATH and
      # self-skip without it; tests/ci-host-tools.test.ts fails the run if it
      # is missing. Prepending ~/.local/bin makes the upstream install script
      # pick that directory (no sudo). install-tools.ts no-ops when the image
      # already has one copy. The installer tracks upstream latest (no version
      # pin is supported), so the version is printed into the job log.
      - name: Install treehouse
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # ponytail: the upstream script asks api.github.com anonymously for the
          # latest tag, and a shared runner IP can get a 403 (rate limit). Up to
          # 3 tries, 30s then 60s apart. Still fails the step after that. Upgrade
          # path: a pinned or authenticated release download in install-tools.
          for attempt in 1 2 3; do
            PATH="$HOME/.local/bin:$PATH" node scripts/install-tools.ts treehouse && break
            [ "$attempt" = 3 ] && exit 1
            echo "treehouse install attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          PATH="$HOME/.local/bin:$PATH" treehouse --version

      - name: Run suite (typecheck + tests)
        run: npm test
        env:
          # Never set CP_LIVE_TESTS here: the live suites hit real models,
          # cost money and need credentials. They self-skip without it.
          CP_LIVE_TESTS: ""
